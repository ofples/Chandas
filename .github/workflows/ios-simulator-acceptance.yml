name: iOS simulator acceptance
on:
  push:
    branches: [codex/ios-support]
    paths: ['.github/workflows/ios-simulator-acceptance.yml', 'scripts/ios-ui-smoke.yaml', 'scripts/ios-simulator-prepare.py']
  workflow_dispatch:
    inputs:
      artifact_url:
        description: EAS simulator tar.gz artifact URL
        required: false
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install EAS app and exercise real controls
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url || vars.CHANDAS_IOS_SIMULATOR_ARTIFACT_URL }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_URL" in https://artifacts.eascdn.net/*|https://expo.dev/artifacts/*) ;; *) echo 'Expected an Expo artifact URL'; exit 1 ;; esac
          mkdir -p artifacts/ios /tmp/chandas-simulator
          curl --fail --location --proto '=https' --max-time 180 --max-filesize 800000000 "$ARTIFACT_URL" -o /tmp/chandas-simulator.tar.gz
          tar -xzf /tmp/chandas-simulator.tar.gz -C /tmp/chandas-simulator
          app="$(find /tmp/chandas-simulator -name '*.app' -maxdepth 2 -print -quit)"
          test -n "$app"
          test -d "$app/PlugIns/ChandasWidgets.appex"
          python3 -u scripts/ios-simulator-prepare.py artifacts/ios/device.txt
          device="$(cat artifacts/ios/device.txt)"
          xcrun simctl install "$device" "$app"
          MAESTRO_VERSION=2.12.1 curl -fsSL https://get.maestro.mobile.dev -o /tmp/maestro-install.sh
          MAESTRO_VERSION=2.12.1 bash /tmp/maestro-install.sh
          "$HOME/.maestro/bin/maestro" --device "$device" test --debug-output artifacts/ios/maestro --test-output-dir artifacts/ios/flows scripts/ios-ui-smoke.yaml
          xcrun simctl spawn "$device" launchctl list > artifacts/ios/processes.txt
          xcrun simctl shutdown "$device"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-acceptance-${{ github.run_number }}
          path: artifacts/ios/
          include-hidden-files: true
          retention-days: 3
