name: iOS simulator acceptance
on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: EAS simulator tar.gz artifact URL
        required: true
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install EAS app and exercise real controls
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_URL" in https://artifacts.eascdn.net/*|https://expo.dev/artifacts/*) ;; *) echo 'Expected an Expo artifact URL'; exit 1 ;; esac
          mkdir -p artifacts/ios /tmp/chandas-simulator
          curl --fail --location --proto '=https' --max-time 180 --max-filesize 800000000 "$ARTIFACT_URL" -o /tmp/chandas-simulator.tar.gz
          tar -xzf /tmp/chandas-simulator.tar.gz -C /tmp/chandas-simulator
          app="$(find /tmp/chandas-simulator -name '*.app' -maxdepth 2 -print -quit)"
          test -n "$app"
          test -d "$app/PlugIns/ChandasWidgets.appex"
          xcrun simctl list devices available -j > /tmp/chandas-devices.json
          device="$(python3 -c 'import json; v=json.load(open("/tmp/chandas-devices.json")); print(next(d["udid"] for k, ds in v["devices"].items() if "iOS-26" in k for d in ds if "iPhone" in d["name"]))')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"
          MAESTRO_VERSION=2.12.1 curl -fsSL https://get.maestro.mobile.dev -o /tmp/maestro-install.sh
          MAESTRO_VERSION=2.12.1 bash /tmp/maestro-install.sh
          "$HOME/.maestro/bin/maestro" --device "$device" test --debug-output artifacts/ios/maestro scripts/ios-ui-smoke.yaml
          xcrun simctl spawn "$device" launchctl list > artifacts/ios/processes.txt
          xcrun simctl shutdown "$device"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-acceptance-${{ github.run_number }}
          path: artifacts/ios/
          retention-days: 3
