name: iOS verification
on:
  push:
    branches: [codex/ios-support]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: bash scripts/ios-cloud-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-verification-${{ github.run_number }}
          path: |
            artifacts/ios/*.png
            artifacts/ios/*.log
            artifacts/ios/*.txt
            artifacts/ios/fixture.json
          retention-days: 1
