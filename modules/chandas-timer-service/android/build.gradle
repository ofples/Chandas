plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.chandastimerservice'
version = '0.1.0'

android {
  namespace "expo.modules.chandastimerservice"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    test.resources.srcDir file("../../../fixtures")
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20250517"
}
