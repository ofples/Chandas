appId: com.yukti.chandas
---
- launchApp:
    clearState: true
- tapOn:
    text: Skip tour
    optional: true
- takeScreenshot: 01-initial-setup
- tapOn: Configurations
- takeScreenshot: 02-configurations
- tapOn: New configuration
- assertVisible: Start timer
- takeScreenshot: 03-setup
- tapOn: Start timer
- tapOn:
    text: Allow
    optional: true
- extendedWaitUntil:
    visible:
      id: running-screen
    timeout: 60000
- takeScreenshot: 04-running
- tapOn: Pause timer
- assertVisible: Resume timer
- takeScreenshot: 05-paused
- tapOn: Resume timer
- assertVisible: Pause timer
- tapOn: Configurations
- assertVisible: New configuration
- takeScreenshot: 06-running-library
